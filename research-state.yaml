    '
  roi_effect_by_benchmark: 'Borehole -4.22 pts (5/5 seeds, control verified bit-identical 4/4) but still
    behind MF-MES 6.40 vs 11.59. Hartmann: h84 showed -1.62 pts but the baseline-beating claim did not
    replicate. Ackley -0.09 (negligible). Currin +0.11, i.e. HARMED on 5/5 seeds. The ROI helps two benchmarks,
    does nothing on one, and harms one.

    '
  why_the_h84_hartmann_number_misled: 'The favourable paired mean at fresh seeds (-3.62) is almost entirely
    one seed where MF-MES collapses (25.25%) and MF-DRO does not (9.56%). On three of the other four MF-DRO
    loses. A ''lower TAIL RISK'' reading was offered and is NOT SUPPORTED: tested across all benchmarks
    and both seed sets, MF-DRO has the smaller worst case on only 2 of 5, and on Hartmann 42-46 and Borehole
    it has BOTH a wider spread and a worse tail than MF-MES. The pattern is a property of seeds 47-51,
    not of the methods.

    '
  the_control_argument: 'Fixed beta is uncontrolled along THREE measured axes: across benchmarks (12.6%-100%
    acceptance), within a run (250x on Borehole), and across SEEDS of the same benchmark (6.9x on Hartmann,
    3.6% to 24.9%). Calibration collapses all three to 1.0x. This case does not depend on the regret numbers
    at all.

    '
  my_prediction_refuted: 'I registered P1 as unlikely to be met, twice, from a +0.010 measurement of the
    ROI''s effect on teacher-action quality at ONE model state. Refuted on Borehole 5/5. The error: that
    measured the teacher, but the ROI acts on the policy through the whole training DISTRIBUTION across
    rollouts.

