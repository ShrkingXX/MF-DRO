# ---- 2026-08-25 outer loop: h57/h58/h59 complete, 66 runs ----
status: >
  Neither SF-DRO nor MF-DRO meets "at least as good as the baselines" on ANY of
  the three benchmarks. Gaps to the best baseline: 0.4pp Currin, 3.0pp Hartmann,
  6.8pp Borehole. Best baseline changes identity per benchmark (SF-MES /
