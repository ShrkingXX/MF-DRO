    on, before computing either.
  SECOND WITHDRAWAL OF THE DAY: >
    Both the ROI's Hartmann flip (h84 4/5 -> h87 2/5) and the HF floor's
    variance result (h85 -> h89) met their bars at n=5 on one seed set, were
    recorded as provisional WITH correct caveats attached, and died at fresh
    seeds. The confirmation discipline is what separates real results from
    these; the caveats did not. TEACHER REFINEMENT (Borehole -5.85, 5/5) SHOULD
    BE ASSUMED NOT TO REPLICATE until h89's Borehole arm and/or session B's h90
    report. [RESOLVED: h89 confirmed it in DIRECTION (4/5) but at 36% of size --
    -2.11, not -5.85. h90 adds a THIRD seed set, 47-51.]

  h94-roi-at-inference: >
    PROTOCOL LOCKED, NOT LAUNCHED, implementation held OUT of src/ as a patch.
    Follows from a CODE AUDIT, not an experiment: **the ROI has never been
    applied to a real query.** use_roi=True restricts only
    simulate_mf_trajectory's teacher pool; the real query is
    action_head(h).clamp(0,1) at mf_dro.py:3090 and no ROI symbol appears
    anywhere between that call and the query being issued (only fidelity
    overrides). Every ROI number in this project is therefore a SECOND-ORDER
    effect through a lossy imitation channel -- teacher proposes in-ROI ->
    actions_x -> L_loc MSE -> the head's weights shift -- not the DRO paper's
    Sec 4.2 constraint on WHERE YOU QUERY. This is the best structural
    explanation on hand for the ROI's signature (real but small on Borehole,
    negligible on Ackley, harmful on Currin, withdrawn on Hartmann): an
    intervention filtered through imitation should be weak and inconsistent.
    It fits h88's reframing -- MF-DRO builds a BETTER global surrogate than
    MF-MES and fails to convert it into queries; the ROI aims at that
    conversion step and then never touches it.
    DESIGN: Borehole seeds 47-51, arms A=NO-ROI and B=ROI-Q10 REUSED from h90,
    C=ROI-PROJECT (snap to nearest in-ROI candidate) and D=SNAP-CONTROL (snap to
    nearest of an UNFILTERED pool) run fresh. 10 new runs.
    **Arm D is the point of the design**: it separates quantizing the DT's
    output onto a finite pool -- a crude relative of the EXCLUDED pool+argmax
    mechanism -- from restricting it to the ROI. If D explains C, the honest
    conclusion is that the excluded mechanism resurfaced, not that the ROI
    works, and it will be reported in those words.
    P1 (C vs D, the discriminator) is registered as GENUINELY UNCERTAIN: seven
    of eight mechanism claims this session were refuted. P5 checks the
    manipulation took at all (>50% of queries actually snapped) before P1/P3
    are allowed to mean anything.
    L_LOC DIAGNOSTIC (EXPLORATORY, zero compute, registered before computing):
    **D1 CONFIRMED -- the imitation channel really is lossy.** The head never
    converges onto the teacher: L_loc falls only 0.048 -> 0.038 over a run and
    ends 0.55 away in L2, 19.5% of the d=8 domain diameter, every query. Better
    than a "predict the per-dim mean" baseline by AT MOST 2.2x, and less than
    that because the teacher's MES-argmax actions concentrate. D2 REFUTED IN
    DIRECTION (ROI-on L_loc is 22% LOWER, not larger) but CONFOUNDED -- the ROI
    concentrates the target, which lowers MSE without better tracking; the patch
    now logs Var(actions_x) so the ratio becomes interpretable. D3 holds: L_loc
    is a training loss over rollout actions, NOT the gap at the real query, so
    it supports h94's premise without establishing it. P5 still settles that.
    CODE COMPLETE, 0 results on disk: worker.py refuses to run if src/ lacks the
    patch (an unpatched run would write a file labelled ROI-PROJECT that is
    really ROI-Q10); analyse.py evaluates P5 first, refuses every bar on
    incomplete arms, and prints the pool-mechanism warning itself if D helps
    while C fails to beat it.
    **RUNNING: 10 workers, seeds 47-51 both arms, 0 FAILs.** Launched only after
    an 8-job crash: NameError 't' (run()'s loop variable, not in scope inside
    _propose_next_query). G1 passed and was structurally INCAPABLE of catching
    it -- with the flag off the hook short-circuits. New standing gate G3:
    execute the ON path end-to-end at minimal scale with the side effect
    OBSERVED before launch. G3 then passed and showed the DT's raw proposal is
    NEVER admissible (snapped 11/11, mean distance 0.73 vs the 0.55
    student-teacher gap), so h94 tests 'nearest in-ROI pool member to the DT's
    output' -- still not pool+argmax, but to be volunteered, not defended.
    Confound named before results: SNAP-CONTROL snaps 0.54 vs 0.73, so P1 cannot
    separate 'the ROI helps' from 'moving further helps'.
    TWO GATES: G1 bit-identity under use_roi=False -- NOT YET PERFORMED, the
    first attempt exceeded 2 min (MF-DRO trains 4000 iterations before its first
    real query); the second ran from two scratchpad COPIES of the tree so live
    src/ was never touched, at a cheap config, and was KILLED at ~7 min because
    the concurrent session went 14 -> 15 workers and made mine the 16th on a
    15-core cap. Third attempt running under a self-limiting wrapper that aborts
    if the count exceeds 14. No H94 result may be reported before G1 passes.
    G2: workers <=5 and h90 complete (it supplies A and B).

open_questions:
  - Does the ROI applied to the QUERY (h94 C) beat the ROI applied to the
    TEACHER (h84/h90 B)? The audit says the latter is a lossy proxy for the
    former; no experiment has ever tested the former.
  - Is any h94 gain attributable to the ROI, or to snapping onto a finite pool
    (arm D)? The second would be the excluded mechanism, not a contribution.
  - Does a controlled ROI raise mean HF query quality (h84 P1)?
  - Does query quality translate to lower final regret (h84 P3, stated separately)?
  # CLOSED by h103 (source audit). Kept, struck through, rather than deleted.
  # - MI-Greedy and MF-GP-UCB under-optimise on Ackley/Hartmann (beat their own
  #   initial design 0.8-3.0 times out of 20-40 HF queries). Cause unresolved;
  #   candidate is the reference's inflated prior mean maxY+2*rangeY.
  - "ANSWERED (h103): the under-optimisation is FAITHFUL, not a defect. Both
    registered baselines are UCB-family, and mfboPreProcessParams.m:229-239 puts
    MF-GP-UCB, Illus-MF-GP-UCB, GP-UCB and MF-MI-Greedy in the inflated-prior
    branch (maxY + 2*rangeY) with the author's own comment 'works best for UCB'.
    Our unconditional form is correct because both methods we implement fall in
    that branch. The prior drives exploration and suppresses exploitation, which
    at ~20-25 HF queries reads as almost no improvement over the initial design.
    NOT our bug -- the h83 comparison stands, and only the frozen protocol's
    PASS is hollowed out. What remains open is a LITERATURE question, not a code
    one: whether the reference's own budget regime makes that prior reasonable
    there. It changes no number here, only how charitably the baselines should
    be described."
  - "Boundary aversion: causal test (change the output parameterisation) not run."
