    boundary_waste_replicates: 'h117 all six predictions PASS at seeds 52-56: 10.0% of HF queries off
      the boundary vs MF-MES 0.2%, effect 2.40. But h118 showed it does NOT predict regret, so it is a
      real inefficiency that is not why MF-DRO loses.

      '
    nothing_generalises: 'h130 + peer h129 P6: four mechanisms (regret benefit, fidelity mix, boundary
      mass, query quality) x four benchmarks = one positive cell each time, always Borehole.

      '
    diagnosis_reproduces_exactly: 'Formula recovered from h84/analyse.py: (y - best_init_HF_y)/(-y_opt
      - best_init_HF_y). Gives Hartmann 0.3362 / 0.7470 / 20.83% against the recorded 0.336 / 0.747 /
      20.8%. The deficit exists on Borehole too (gap 0.29-0.31 vs Hartmann''s 0.41) -- so the ROI attacks
