established:
  - SF-DRO beats MF-DRO 3/3 Borehole, 2/3 Hartmann -- MEASUREMENT STANDS, but
    the attribution to multi-fidelity is RETRACTED (confounded). The two configs
    differ in surrogate (KO-GP vs SingleTaskGP), rollout teacher (MF-MES vs EI),
