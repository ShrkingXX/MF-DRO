lessons_added_this_phase:
  - >
    Derive the reachable range of a formula you control BEFORE experimenting on
    it. target = max(batch_max, alpha*running_max) with batch_max <= running_max
    caps the band at 1/alpha -- two lines of algebra that would have prevented
    both H9 and H10.
  - >
    Put the manipulation check FIRST as a standalone gate, and commit to
    stopping on failure. H12 did this and stopped cleanly; H9/H10/H11 spent full
    experiments before discovering their manipulation never happened.
  - >
    A null-guard must be CONDITIONED on the manipulation check passing. H11's
    guard fired on 'all arms ~0%' even though arm C's manipulation never
    occurred, and auto-printed a conclusion that had to be retracted.

