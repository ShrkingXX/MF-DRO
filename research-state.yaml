  h101-head-shrinkage: >   # renumbered from h97, ID collision
    EXPLORATORY, zero compute, h90 Borehole. **BOUNDARY AVERSION IS A SPREAD
    FAILURE, NOT A CENTRING FAILURE.** S2 FAILED and the failure is the finding:
