    \ ANTI-TRACKS IT (down 10.6% on Hartmann where the ROI failed, up 9.5% on Borehole where it worked),\
    \ so dispersion is NEITHER NECESSARY NOR SUFFICIENT. Hartmann was registered as the falsifier BEFORE\
    \ computing; Ackley/Currin predicted before looking (absent on both: right; negative on Currin: WRONG).\
