diagnosis:
  summary: 'MF-DRO finds a competitive BEST point but wastes far more budget getting there. Scoring each
    post-init HF query (y-best_init)/(y_opt-best_init):

    '
  numbers: "Hartmann  MF-DRO mean 0.336 vs MF-MES 0.747; 20.8% of HF queries land WORSE\n          than\
    \ the initial design (MF-MES 5.3%); per-dim spread 3.5x MF-MES\nBorehole  MF-DRO mean 0.381 vs MF-MES\
    \ 0.669; MF-DRO makes MORE HF queries\n          (94 vs 84) and still finds a worse maximum -- NOT\
    \ budget starvation\n"
  mechanism: 'h83 runs the regression head (use_candidate_scoring=False): the DT emits x = action_head(h).clamp(0,1)
    directly, with NO acquisition maximisation at inference. Its training targets are rollout-teacher
    actions argmaxed over roi_candidates, which with use_roi=False is UNIFORM over the domain. So the
    policy is trained on domain-spread targets and learns to propose diffusely.

    '
  borehole_specific: 'Boundary aversion, RESURRECTED after being wrongly eliminated. 99.6% of Borehole''s
    variance is in dims 0/3/5/6, all four with x* ON the boundary; MF-DRO reaches them in 0-2% of HF queries
    vs MF-MES''s 34-70%. The recorded elimination used UNWEIGHTED distance to x*; weighting by sensitivity
    REVERSES it (0.0543 vs 0.0308). One link of the elimination chain is broken.

    '
current_experiment:
  id: h84-roi-strategy
  status: 32/34 done, 0 failures. Reproduction control PASSED 4/4 bit-identical.
  headline: 'h83''s PRIMARY finding STANDS: MF-DRO beats no baseline on any benchmark. An earlier claim
    that the calibrated ROI overturned this on Hartmann was ANNOUNCED AND THEN WITHDRAWN -- h87 re-tested
    it with q=0.10 fixed in advance, one arm, fresh seeds 47-51, and it failed at 2/5 seeds against a
