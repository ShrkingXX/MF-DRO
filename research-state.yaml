  the_2x2_both_benchmarks: 'BOREHOLE: control 15.82 5/5 | h153 frozen 19.36 5/5 |
    h161 stale 19.53 5/5 | h155 UCB 15.13 5/5 | h159 exploit 19.07 5/5 | HEAD
