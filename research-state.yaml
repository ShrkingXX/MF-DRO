    cause the 8.6pp gap. Needs a one-variable-at-a-time decomposition.
  - DRO beats its own-fidelity MES on exactly 1 of 3 benchmarks (Hartmann 3/3),
    which is also the only benchmark whose LF optimum (4.0019) EXCEEDS its HF
    optimum (3.3224).
  - the catastrophic-seed variance survives removing the fidelity head:
    SF-DRO Currin mean 0.0619 vs median 0.0012 (50x).

