current_front:
  question: 'WHY better trajectory quality does not improve MF-DRO.'
  status: 'ANSWERED by intervention (h171/h173), but the answer has TWO STRENGTHS
    and they are scoped differently. WEAK FORM (two benchmarks): a bad first step
    is fatal regardless of the other seven, and a good first step buys most of what
    a good trajectory buys -- HEAD < TAIL on both (Borehole 16.96 vs 43.94;
    Hartmann 25.16 vs 46.45), plus the centroid split on both. STRONG FORM
    (Borehole only): ONLY the first step matters -- HEAD matched the control there
    (16.96 vs 15.82) but is worse on 5/5 Hartmann seeds (25.16 vs 7.99), so the
    later steps DO contribute on Hartmann. h173 was reported as R2 at n=4 and is
    CORRECTED to R3 at n=5. The tau=0 conditional-mean mechanism has an unexplained
    ~5 SE residual, and h171''s fidelity-head "independent confirmation" is
    WITHDRAWN (the teacher''s 0.25 and minimum_hf_fraction 0.25 coincide).'

  THE_ANSWER: 'Only the teacher''s FIRST step reaches inference. The DT is always
    queried at timestep=0, and at tau=0 the training states are near-degenerate
    (uniq_tau0_states=3 of 60; the real inference state is bit-identical to one of
    them), so the DT reproduces roughly its teacher''s AVERAGE FIRST MOVE.
    Trajectory quality describes where a trajectory GOES; only its first step is
    ever consulted. A perfect teacher''s first move is a random start point, whose
    average is the middle of the box.'

  established_by_intervention: 'h171. HEAD-MES (acquisition on 1 of 8 steps,
    random for 7) = 16.96 rel%, 5/5, query centroid 0.7397. TAIL-MES (acquisition
    on 7 of 8, random first) = 43.94 rel%, 0/5, centroid 0.0313. Both halves of a
    forecast committed at 0/5. The BETTER teacher on 7 of 8 steps FAILS. Neither
    individually-fatal outcome (R1 HEAD fails, R2 TAIL works) occurred.'

  h180_rule_invariance: 'EXPLORATORY, no new runs. The DT''s emitted FIRST QUERY
    is invariant to the teacher''s RULE but moves for teachers that change WHAT IS
    AVERAGED. Borehole: rule-varying arms sit 0.044-0.065 from the control''s first
    query and perform 15.13-19.53; averaging-varying arms sit 0.157-0.434 and four
    of five pin at the 43.94 saturation floor. REPLICATES on Hartmann, which is the
    CLEANER test (no ceiling -- its far arms take four distinct values 25.16/46.45/
    52.23/65.14). Positive control: MES->RANDOM moves the query 9.9x further than
    MES->UCB-LOC, ranges disjoint, and RANDOM lands nearer the box centre (0.337 vs
    0.520) as the conditional-mean account predicts -- so the instrument is not
    blind. NO correlation reported: Borehole''s four-arm tie at 43.94 makes r a
    ceiling artifact. HONEST LIMIT: genuine rule changes number 2 on Borehole
    (UCB-LOC, EXPLOIT-LOC) and 1 on Hartmann (UCB-LOC), and both are
    posterior-greedy; MES-FROZEN/STALE-PATH are TARGET manipulations, not rule
    changes, and do not count toward rule-diversity. THIS IS WHY six accounts fell
    (all changed the rule) and why the two working interventions worked (h149
    selection, h172 shortening -- both change the averaging).'

  h180_bitlevel_confirmation: 'MES-FROZEN and STALE-PATH emit a BIT-IDENTICAL first
    query on 5/5 seeds, and identical first TEN queries -- different experiments,
    different manipulations, different files (different md5 and lengths). Both
    manipulate the RTG target, which h177/h178 showed is architecturally inert. If
    that channel does not reach the action, two different target manipulations must
    emit the same action. They do, at bit level.'

  declined_arms_this_tick: 'TWO arms declined on MEASURED premise checks, not on
    judgement. (1) h174''s registered follow-up (hold the fidelity mix fixed while
    shortening): the minimum_hf_fraction floor predicts L=1 has LESS HF; observed
    MORE on both benchmarks (Hartmann 0.776 vs 0.200, Borehole 0.939 vs 0.883).
    Wrong in DIRECTION. The mix shift is intrinsic to shortening and cannot be
    fixed minimally; the actionable claim stays Borehole-scoped. (2) Teacher
    rotation (mes + ucb_loc, the only two coherent members -- 4 of 5 shipped
    TEACHER_POOL members are incoherent): the two teachers agree to 0.044 against a
    0.82 seed-noise floor, so rotation cannot produce a resolvable effect.'

  h179_h181_conditioning: 'h179 (5/5, Borehole, CONFIRMATORY): standardising the
    conditioning gives regret 16.66 vs control 15.82 -- paired +0.85 rel% pts
    (se 0.62), +5.4% relative, INSIDE the 6.1% harness noise floor established
    before the arm. 2/5 seeds clearly worse, 3/5 tied. Verdict P2 -> R3 (the
    channel is irrelevant either way; the "defect with a fix" framing downgrades
    to a curiosity). The channel IS responsive under standardisation: RTG
    responsiveness 0.1010, fidelity flips on 23% of iterations. GATE WEAKNESS: the
    protocol wrote improves/unchanged/degrades with NO numeric width for
    "unchanged"; check_gate.py was not run on it. Resolved with the pre-existing
    floor, not a post-hoc threshold. PROVISIONAL: h179 is the ONLY probe ever run
    on Borehole (h168/h177/h178 are all Hartmann), so it varies standardisation
    AND benchmark at once. h181 (RUNNING, 5 seeds, one-line diff) is the matched
    unstandardised Borehole control; all three of its read-branches are
    pre-specified in h179''s analysis.md. Under two of the three, h179''s headline
    changes; under one, h178''s in-situ claim is what falls.'

  h182_centre_collapse: 'EXPLORATORY, no new runs. The failure mode is COLLAPSE TO
    THE BOX CENTRE. Distance from the centre over the last 20 HF queries is
    near-monotone with frozen regret across 28 MF-DRO Borehole arms (Spearman
    -0.967; GP baselines -0.800; pooled -0.918), and perfectly rank-monotone over
    6 Hartmann arms. Endpoints RANDOM-POOL 0.070->43.94, MF-MES 1.093->6.40.
    SELF-CORRECTION: the first pass called Borehole BIMODAL with a 0.70-wide gap on
    10 hand-picked arms; running ALL arms fills the gap (0.752/0.778/0.798 with
    regrets 24.25/22.28/19.53) -- the bimodality was a sampling artifact.
    COUNTEREXAMPLE named: MF-MI-Greedy escapes (0.904) and still fails (28.44), but
    it is a GP baseline with no DT, hence out of population. DIAGNOSTIC CAUTION:
    query_dist_to_xstar_per_iter is ANTI-monotone here -- ||centre-x*||=0.5681, so
    a centre-collapsed arm scores ~0.57 while converging nowhere (RANDOM: 0.582).
    Must not be read alone. DOES NOT explain the benchmark asymmetry: HEAD retains
    95% of the control''s escape on Borehole and 90% on Hartmann, yet costs 1.07x
    vs 3.15x. The asymmetry STAYS OPEN, as since h175.'

  settled_negative: 'Teacher QUALITY and endpoint DIVERSITY are both orthogonal.
    h158 swept them on ONE axis: quality +51%, diversity -34%, signal moved 3.2
