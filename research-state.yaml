project: mfdro-aistats
question: 'Can a method built on SF-DRO (papers/DRO.pdf) match or beat standard multi-fidelity BO baselines?
  If not, what specifically makes MF-DRO waste its high-fidelity budget, and can the paper''s own ROI
  heuristic fix it?

  '
branch: mfdro-hartmann-autoresearch
phase: deepening
last_updated: 2026-08-28
status: 'NORTH STAR SETTLED NEGATIVE. h83 (100 runs, 5 methods x 4 benchmarks x 5 seeds, 0 failures) is
  the headline comparison and its PRIMARY pre-registered prediction -- that MF-DRO beats no baseline --
  was MET on all four benchmarks. The project has since turned from "does it win" to "why does it lose",
  and that diagnosis is now concrete and mechanistic. Three candidate fixes were tried; two (the ROI''s
  Hartmann flip, the HF floor) were WITHDRAWN after fresh seeds, and teacher refinement survived but shrank
  64% and failed its cost bar. **h90 has now CONFIRMED the ROI''s Borehole gain at fresh seeds (P1/P2/P3
  met, pooled n=10 mean -3.86, 9/10, 83% retention).** The answer to the primary question is therefore
  POSITIVE on one benchmark: a per-iteration calibrated beta_t does measurably stop MF-DRO wasting budget,
  halving the gap to MF-MES on Borehole without closing it. h90''s refinement arm is still running.

  '
