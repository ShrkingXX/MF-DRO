  answer_so_far: 'PARTIAL AND NEGATIVE. Tightness is a real lever (h125) but everything the ROI does,
    it does on Borehole; on Hartmann -- where the diagnosis was taken and where the waste is largest --
    it moves neither regret nor quality.

    '
  what_is_established:
    tightness_is_a_lever: 'h125: q=0.100 vs q=0.493 (5x, both realized to 3 decimals) gives Borehole regret
      +9.018, effect 5.69, 5/5. The prior "tightness is a null axis" failed because every study behind
      it was a 2x contrast or narrower.

      '
    dose_response_shape: Flat below q=0.10; steep degradation by q=0.5. Useful region q<=0.10.
    loose_forfeits_not_harms: 'h128: q=0.493 gives -1.31% vs control (effect 0.54, 3/5) against q=0.100''s
      -4.22% (1.74, 5/5). Loose forfeits ~69% of the benefit; it is NOT harmful.

