  ACTIONABLE_RESULT: 'h172. Shorter rollouts are BETTER and FASTER, monotonically.
    L=8 (control) 15.82 rel% 5/5 in 82.4 min | L=2 13.97 5/5 in 22.5 min (3.66x) |
    L=1 13.69 5/5 in 13.2 min (6.26x). Both shortened arms BEAT the control. P2
