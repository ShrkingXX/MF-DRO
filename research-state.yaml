h125_tightness_dose_response:
  status: COMPLETE. **MY LOCKED NULL IS REFUTED.**
  contrast: 'ROI-Q10 (measured realized q=0.100 exactly, every seed both benchmarks) vs ROI-ANN (0.493/0.498).
