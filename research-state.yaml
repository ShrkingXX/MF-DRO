diagnosis:
  summary: 'MF-DRO finds a competitive BEST point but wastes far more budget getting there. Scoring each
    post-init HF query (y-best_init)/(y_opt-best_init):

    '
  numbers: "Hartmann  MF-DRO mean 0.336 vs MF-MES 0.747; 20.8% of HF queries land WORSE\n          than\
    \ the initial design (MF-MES 5.3%); per-dim spread 3.5x MF-MES\nBorehole  MF-DRO mean 0.381 vs MF-MES\
    \ 0.669; MF-DRO makes MORE HF queries\n          (94 vs 84) and still finds a worse maximum -- NOT\
    \ budget starvation\n"
  mechanism: 'h83 runs the regression head (use_candidate_scoring=False): the DT emits x = action_head(h).clamp(0,1)
    directly, with NO acquisition maximisation at inference. Its training targets are rollout-teacher
    actions argmaxed over roi_candidates, which with use_roi=False is UNIFORM over the domain. So the
    policy is trained on domain-spread targets and learns to propose diffusely.

    '
  borehole_specific: 'Boundary aversion, RESURRECTED after being wrongly eliminated. 99.6% of Borehole''s
    variance is in dims 0/3/5/6, all four with x* ON the boundary; MF-DRO reaches them in 0-2% of HF queries
    vs MF-MES''s 34-70%. The recorded elimination used UNWEIGHTED distance to x*; weighting by sensitivity
    REVERSES it (0.0543 vs 0.0308). One link of the elimination chain is broken.

    '
current_experiment:
  id: h84-roi-strategy
  status: 32/34 done, 0 failures. Reproduction control PASSED 4/4 bit-identical.
  headline: 'h83''s PRIMARY finding STANDS: MF-DRO beats no baseline on any benchmark. An earlier claim
    that the calibrated ROI overturned this on Hartmann was ANNOUNCED AND THEN WITHDRAWN -- h87 re-tested
    it with q=0.10 fixed in advance, one arm, fresh seeds 47-51, and it failed at 2/5 seeds against a
    bar requiring 4/5. See the WITHDRAWN section in findings.md.

    '
  roi_effect_by_benchmark: 'Borehole -4.22 pts (5/5 seeds, control verified bit-identical 4/4) but still
    behind MF-MES 6.40 vs 11.59. Hartmann: h84 showed -1.62 pts but the baseline-beating claim did not
    replicate. Ackley -0.09 (negligible). Currin +0.11, i.e. HARMED on 5/5 seeds. The ROI helps two benchmarks,
    does nothing on one, and harms one.

    '
  why_the_h84_hartmann_number_misled: 'The favourable paired mean at fresh seeds (-3.62) is almost entirely
    one seed where MF-MES collapses (25.25%) and MF-DRO does not (9.56%). On three of the other four MF-DRO
    loses. A ''lower TAIL RISK'' reading was offered and is NOT SUPPORTED: tested across all benchmarks
    and both seed sets, MF-DRO has the smaller worst case on only 2 of 5, and on Hartmann 42-46 and Borehole
    it has BOTH a wider spread and a worse tail than MF-MES. The pattern is a property of seeds 47-51,
    not of the methods.

    '
  the_control_argument: 'Fixed beta is uncontrolled along THREE measured axes: across benchmarks (12.6%-100%
    acceptance), within a run (250x on Borehole), and across SEEDS of the same benchmark (6.9x on Hartmann,
    3.6% to 24.9%). Calibration collapses all three to 1.0x. This case does not depend on the regret numbers
    at all.

    '
  my_prediction_refuted: 'I registered P1 as unlikely to be met, twice, from a +0.010 measurement of the
    ROI''s effect on teacher-action quality at ONE model state. Refuted on Borehole 5/5. The error: that
    measured the teacher, but the ROI acts on the policy through the whole training DISTRIBUTION across
    rollouts.

    '
  metric_lesson: 'PRIMARY was set on MEAN query quality; simple regret is a MAX statistic. Hartmann shows
    d(mean) +0.000 with d(best) +0.022 and regret -2.17pts, so the mean-based bar records nothing while
    the method helps. See Lesson 22.

    '
  strategy: 'Control the ROI ACCEPTANCE RATE and solve for beta_t by bisection. Keeps the paper''s set
    X_hat_{m,t} = {x | UCB >= max LCB} exactly; sets only beta_t, which the paper subscripts by t but
    never specifies. A constant beta is unusable: acceptance swings 250x on Borehole (100% at n_hf=10,
    0.4% at 35).

    '
  arms:
  - ROI-OFF (h83 reuse
  - control PASSED)
  - ROI-FIX2
  - ROI-Q10
  - ROI-ANN
  registered_bars: 'P1 FAILED (set on MEAN query quality; simple regret is a MAX statistic -- Lesson 22).
    P2 REFUTED (fixed beta was predicted to buy nothing on Borehole; it posted the best regret there).
    Five mechanism claims refuted in total -- Lesson 23, four of them erring by UNDERESTIMATING the intervention.

    '
  falsifier: 'If ROI-Q10 and ROI-ANN both fail P1, budget waste is NOT a candidate- distribution problem
    and the target becomes the output parameterisation.

    '
constraints:
- 'use_candidate_scoring=True is NOT an acceptable fix (human-directed): pool+argmax is not the contribution.'
- use_roi=False must stay bit-identical (gated at every commit).
- 'MF-DRO defaults in force: M=3, n_roi_candidates=600, refinement OFF.'
- num_workers x threads <= 15.
- No p-values at n<=5. Protocol commits BEFORE result commits.
completed_diagnostics:
  h88-surrogate-vs-data: 'COMPLETE. Same KO GP, same 4096-point recommender, three different datasets.
    THE LIMIT IS THE SURROGATE, NOT THE DATA. Every recommendation across all three conditions and both
    benchmarks lands in 11.96-29.03% relative regret, while the best OBSERVED points reach 0.67-19.19%.
    The KO global argmax is a poor point regardless of what it is fit on.

    '
  h88_key_numbers: 'condition                    Hartmann   Borehole

    A: fit on MF-DRO''s queries     13.15%     22.66%

    B: fit on MF-MES''s queries     19.92%     21.42%

    C: fit on a Sobol design       29.03%     22.64%

    (C''s own best observation:     65.51%     31.90%)

    '
  h88_consequences: '(1) Rules out "recommend from the model instead of reporting the best query" as an
    avenue. (2) Bounds what any data-side intervention (ROI, teacher refinement, HF floor) can buy. (3)
    Does NOT excuse MF-DRO''s query quality -- simple regret depends on the best QUERY, which is where
    MF-DRO loses. (4) Refutes "good model, bad policy" as the bulk explanation, though the model does
    beat its own best query on 1 of 10 runs under a strong recommender (0 of 20 under the live weak one).

    '
  h88_correction: 'Recommendation quality is NOT monotone in design dispersion: MF-DRO (moderate) > MF-MES
    (concentrated) > Sobol (maximal). An earlier claim that MF-DRO''s dispersion produces a better global
    surrogate was an extrapolation from two points that condition C refuted. There is an interior optimum
    and MF-DRO happens to sit nearer it.

    '
