  METRIC_RULES_THE_HARD_WAY:
  - State the statistic, the READ POINT, the QUANTITY, and WHICH CELLS.
  - cost_curve is POST-INIT for MF-DRO and CUMULATIVE for MF-MES. Cross-method comparisons must use end-of-run;
    within-MF-DRO use @cost_curve 200.
  - A bar is portable only to the statistic AND benchmark scale it was measured on.
  - A gate that cannot reach the changed line is not a gate.
  - A verdict NAME is part of the registration; residual categories drift toward asserting the null.
  - Report the difference and its spread, never a ratio, when the denominator is itself an effect that
    might be null.
  - When you retract a claim, find every surface it was published on.
