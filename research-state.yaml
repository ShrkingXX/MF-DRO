    the protocol normalized out the dimensionality confound and missed the weighting one (4th time bitten
    by it). SURVIVES REGARDLESS: Borehole scores 0.0000 and the ROI works, so the ''an ROI containing
    nothing near the optimum starves the DT'' rationale -- the failure that got the ROI deleted before
    -- is FALSE as stated with this measure. NET: h96''s four-benchmark relocation pattern is REAL and
