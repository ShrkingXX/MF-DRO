    roi_benefit_pooled: -3.86% of optimum, effect 1.58, 9/10 seeds (n=10, pooled).
    composite_is_strongest: 'ROI+L1 -5.958%, effect 2.25, 10/10, beating each component separably. Interaction
      NOT DETECTABLE (sd 2.420 vs estimate 0.110) -- not ''additive''.

