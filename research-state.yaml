    \ benchmarks.**\n  benchmark   max var share  x* on bdry  MF-DRO deficit   ROI effect\n  Borehole\
    \        0.83         7 of 8     REAL (2/10)     WORKS -3.68\n  Currin          0.81         1 of\
    \ 2     nil (saturated) none\n  Hartmann        0.35         0 of 6     tie  (5/10)     none\n  Ackley\
    \          0.10         0 of 10    tie  (5/10)     none\nOne positive case, so every property unique\
    \ to Borehole explains the pattern equally well -- concentration, boundary optimality and deficit\
    \ size co-occur perfectly. This is WHY h99 (headroom) and h100 (containment) fell so cleanly: any\
    \ gate must fail on three and hold on one, which unrelated quantities do by construction. **Passing\
