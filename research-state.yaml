    ROI cannot help much because THE CONSTRAINT IS ALREADY SATISFIED, not because the imitation channel
    is lossy. Reconciles with L_loc: imitating a REGION is easier than imitating a POINT, and only the
    region is what the ROI constrains. WITHDRAWN: Amendment 7''s "the DT''s proposal is NEVER admissible
    (11/11)", which came from a smoke test at bo_iterations=60/num_epochs=1 and does not hold at 4000/10.
    DELIVERED INSTEAD: a fresh-RNG replication of the teacher-side ROI at the same seeds -- h90 -3.49
    (4/5), h94 -3.86 (5/5), pooled n=10 **-3.68 at 9/10**, agreeing to 0.72 pts per seed. Three independent
    Borehole measurements now: h84 -4.22, h90 -3.49, h94 -3.86. SNAP-CONTROL fired (100% by design) and
    IS interpretable: same mean as the ROI, THREE TIMES the spread (sd 3.98 vs 1.28), producing both the
    project''s best Borehole result (5.78, below MF-MES''s 6.40) and one worse than doing nothing. Quantizing
    onto a finite pool is a lottery, not a hidden source of the ROI''s gain.

    '
