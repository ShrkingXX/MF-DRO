    per-iteration GP refit and DT training). SC1 passes (HF 0.939/0.869 vs 0.883).
    Contention runs PROTECTIVE here -- h172 ran at 15/15 workers, the session
    high, against a control at unknown lower load, so 6.26x can only be
    understated. L=4 still running; a non-monotone dose is not yet excluded.
    THIS IS THE FIRST CHANGE TO WHAT THE CODE SHOULD DO to come out of this front.
    SCOPE: BOREHOLE ONLY. h174 tried L=1 on Hartmann and SC1 FIRED -- it makes 24
