    \   SEPARABLE\n  Q10 vs no-ROI  -3.49  sd 2.66  ratio 1.31  4/5   SEPARABLE\n  Q05 vs Q10     -1.52\
    \  sd 1.21  ratio 1.26  4/5   SEPARABLE\nAll three separable -- worth noting against four of my own\
    \ bars today that passed at ratios of 0.16, 0.38 and effectively zero. CORRECTS h98, which treated\
    \ ROI-FIX2 as the \"accept 0.21\" level of a dose. FIX2 is the FIXED-beta arm; its acceptance DRIFTS\
    \ 250x within a run and 0.21 is the average of that drift, so it is not a dose point at all. Among\
    \ the CALIBRATED arms the dose is monotone: 0.49 not separable (a loose ROI does nothing), 0.10 separable,\
