    form is correct for both methods we implement. NOT our bug -- h83 stands; only the frozen protocol''s
    PASS is hollowed out. Nearly published the opposite: two lines of that MATLAB read alone imply MI-Greedy
    should get meanY, and the branch four lines above names it explicitly. CLOSES the ''baselines under-optimise,
    cause unresolved'' open question.

    '
  h101-head-shrinkage: 'EXPLORATORY, zero compute, h90 Borehole. **BOUNDARY AVERSION IS A SPREAD FAILURE,
    NOT A CENTRING FAILURE.** S2 FAILED and the failure is the finding: the head relocates its centre
    toward the CORRECT bound in all four sensitive dims (offsets .456/.327/.290/.325) while sitting at
    the domain centre in the insensitive ones (.082, a 4.3x difference). The head knows where to go. S1/S3
    MET: the output cloud is 3-6x TIGHTER than uniform in every dimension (SD/uniform .18-.30, sd of the
    ratio .044). Reach is governed by residual gap/sd -- dim0 lands 0.84 sd from its bound and reaches
    70%; dims 3/5/6 land 2.0-3.3 sd away and reach 0.2-2%. Gaussian prediction reproduces the ordering
    with mean error 0.066 over FOUR points (a ranking, not a law). NEITHER registered mechanism was right
    -- the answer, correct centring plus insufficient spread, was not in my two-way framing. Second time
    today a two-way framing excluded the truth. CHANGES THE PRESCRIPTION from h96''s implied architecture
    rewrite: the head already gets 83-98% of the way. Two cheap levers -- sharpen centring via a sensitivity-weighted
    L_loc (preferred, one loss change), or widen the output (no longer obviously wrong, since h95/h96
    showed more dispersion came with BETTER regret).

    '
  h96-roi-relocation: "EXPLORATORY, zero compute. **MECHANISM FOUND, WITH SEVERE LIMITS.** The ROI works\
    \ by RELOCATING the query cloud toward x* in the dimensions carrying the variance -- not by concentrating\
    \ it. Sensitivity-weighted distance, all four benchmarks, ROI-Q10 vs no-ROI:\n  Borehole  WORKED -3.49\
    \      relocation PRESENT -0.0144, closer 5/5\n  Hartmann  FAILED            relocation ABSENT  +0.0070,\
    \ closer 3/5\n  Ackley    -0.09 negligible  relocation ABSENT  +0.0088, closer 1/5\n  Currin    +0.11\
    \ HARMED      relocation ABSENT  -0.0007, closer 2/5\nRelocation tracks the outcome 4/4; DISPERSION\
    \ ANTI-TRACKS IT (down 10.6% on Hartmann where the ROI failed, up 9.5% on Borehole where it worked),\
    \ so dispersion is NEITHER NECESSARY NOR SUFFICIENT. Hartmann was registered as the falsifier BEFORE\
    \ computing; Ackley/Currin predicted before looking (absent on both: right; negative on Currin: WRONG).\
    \ The PRIMARY measure was named in the protocol as the sensitivity-weighted distance, chosen from\
    \ findings.md:3174's prior finding, before seeing numbers: weighted gives 5/5 on Borehole, unweighted\
    \ an ambiguous 3/5. First time the h85-P4 rule (name the deciding measure in advance) changed a result.\
    \ LIMITS, load-bearing: **exactly ONE positive case** -- three negatives are cheap agreement and one\
    \ benchmark where the ROI works without relocating would sink it. And it **does NOT explain HARM**:\
    \ Currin got worse with relocation at zero. Open question, not absorbed. BOUNDS THE GAIN: on Borehole\
    \ the ROI improves reach in dim 0 (81.6% of variance, 0.701->0.747) and barely moves dims 3/5/6 (0.049/0.003/0.007\
    \ vs MF-MES's 0.49/0.34/0.70). That is why it closes 37% of the gap and cannot close more -- the residual\
    \ is boundary aversion, which an ROI cannot fix because it selects WHERE to look, not what the head\
    \ can emit. Makes the output-parameterisation experiment the highest-value next lever, with a specific\
    \ quantitative target for the first time.\n"
  h95-roi-waste-mechanism: 'EXPLORATORY, zero compute, on h90''s Borehole runs. Bars registered 20:53:57
    before computing. **THE ROI IMPROVES THE AVERAGE QUERY BY DISPERSING MORE, NOT LESS.** Mean HF query
    regret falls 4.15 pts on 5/5 (M3 MET), waste fraction falls where waste exists (3/3 nonzero cases,
    roughly halved) but M1 FAILED on a bar I designed badly -- the measure has a floor at zero and 2/5
    seeds sat on it in both arms, so ">=4/5 strictly better" was unmeetable. Recorded as FAILED rather
    than rewritten after seeing data. **M2 FAILED IN THE OPPOSITE DIRECTION AND THAT IS THE FINDING**:
    the ROI INCREASES dispersion (+0.010, higher on 4/5) while improving both regret and mean query quality.
    The concurrent session measured it independently under a different statistic and got the same sign
    (+9.5% overall, +14.3% on HF). This contradicts the premise this investigation was handed -- "proposals
    are 3x more dispersed" invites "concentrate them", and on the one benchmark where an intervention
    demonstrably works it did the opposite. With h88 (MF-DRO''s wider queries give a BETTER global surrogate),
    two independent lines now say **dispersion is a correlate of MF-DRO''s failure, not its cause.** Any
    future fix justified by reducing dispersion must explain this. Normalization caveat: both arms sit
    at ~0.25x the dispersion of a uniform draw, so this is a change WITHIN an already-concentrated regime.

    '
  h90-borehole-confirm: '**ROI ARM COMPLETE, P1 MET.** The Borehole ROI gain SURVIVES fresh seeds 47-51:
    paired mean **-3.49**, sd 2.66, ROI better **4/5** (-6.05, -1.87, -3.97, -5.77, +0.22), against -4.22
    and 5/5 on the development seeds -- 83% retention. Combined n=10: -3.85, 9/10. Drop-one-seed mean
    stays negative in all five. P2 MET (margin shrank, as predicted). P3 MET (still does NOT beat MF-MES:
    12.25 vs 6.40). THE FIRST INTERVENTION THIS SESSION TO PASS A CLEAN FRESH-SEED CONFIRMATION. Pre-registration
    verified by timestamp, not asserted: bars committed 18:54:17, earliest result of any arm 19:31:10,
    earliest treatment result 19:54:20. Amendment 4 changed control flow only; bar expressions byte-identical
    across the diff. NORTH STAR UNCHANGED -- MF-DRO still beats no baseline; the gain closes about a quarter
    of the MF-MES gap and is Borehole-only (Hartmann -1.62 3/5 flip withdrawn, Ackley -0.09 1/5, Currin
    +0.11 0/5 HARMED). REFINE-100 arm still running -- h90''s P4, the third seed set for teacher refinement.

    '
  h89-hffloor-confirm: 'COMPLETE, 25 runs, 0 failures. TWO VERDICTS. (a) HF FLOOR: **WITHDRAWN**. At fresh
    seeds 52-56 the across-seed sd went UP (2.08 -> 3.17, P1 PRIMARY FAILED) and the paired mean got WORSE
    by 1.60 pts (P2 FAILED), better 1/5. P3 MET (collapse recurs, streaks 4/11/6) but P4''s correlation
    is -0.84, the WRONG SIGN -- the floor HARMS the most-collapsed seeds (seed 54: 0.76% -> 9.07%). Mechanism
    inverted, not just unconfirmed. (b) TEACHER REFINEMENT: **SURVIVES at 36% of its size**. Paired -2.11
    pts, better 4/5 (P5 PRIMARY MET). P6 FAILED (needed <= -2.9), so per the registered falsifier **h85''s
    -5.85 is SUPERSEDED; -2.11 is the figure.** P8 MET: does NOT close the gap to MF-MES (12.91% vs 10.07%
    at matched seeds, comparator re-run at seeds 52-56 because h83''s 6.40% is from 42-46 and those seeds
    are 3.67 pts easier).

    '
  h85_P4_CORRECTED: 'h85''s P4 (cost) is **FAILED**, not met. The bar said "wall-clock cost under 2x";
    TOTAL wall-clock on Borehole is 2.07x (82.4 -> 170.7 min). It was first reported MET at 1.97x using
    PER-QUERY wall-clock, a measure the bar never named and the one that happened to pass. Rule now standing:
    when a bar admits more than one measure, report BOTH and name which the verdict turns on, before computing
    either.

    '
  SECOND WITHDRAWAL OF THE DAY: 'Both the ROI''s Hartmann flip (h84 4/5 -> h87 2/5) and the HF floor''s
    variance result (h85 -> h89) met their bars at n=5 on one seed set, were recorded as provisional WITH
    correct caveats attached, and died at fresh seeds. The confirmation discipline is what separates real
    results from these; the caveats did not. TEACHER REFINEMENT (Borehole -5.85, 5/5) SHOULD BE ASSUMED
    NOT TO REPLICATE until h89''s Borehole arm and/or session B''s h90 report. [RESOLVED: h89 confirmed
    it in DIRECTION (4/5) but at 36% of size -- -2.11, not -5.85. h90 adds a THIRD seed set, 47-51.]

