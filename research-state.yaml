project: mfdro-hartmann-freeze
question: >
  Does MF-DRO's incumbent-freeze on Hartmann 6D have a within-DRO-frame fix
  that yields lower final simple regret than MF-MI-Greedy and MF-GP-UCB at
  matched real cost?
protocol: PROTOCOL.md   # frozen; evaluation may not be changed by the loop
branch: mfdro-hartmann-autoresearch
phase: inner-loop
status: >
  Frozen evaluation COMPLETE and reported (FAIL). H4/H5 refuted. H6 inconclusive
  at n=10; extension to a pre-specified n=30 running (seeds 52-71, both arms).

headline_result:
  experiment: h1-leak-fix-validation (30/30 runs, 6979 s wall)
  frozen_success_test: FAIL
  detail: >
    MF-DRO 0.5047 +/- 0.0395 vs MF-MI-Greedy 0.5091 +/- 0.1266 and MF-GP-UCB
    1.7934 +/- 0.1223, at matched cost (201.5 / 207.2 / 200.0). MF-DRO mean+SE
    = 0.5442 >= MI-Greedy mean-SE = 0.3825. Reported exactly as pre-registered;
    PROTOCOL.md permits this outcome.
  paired_analysis: >
    MF-DRO better on 4/10, worse on 6/10; mean paired diff -0.0045 but MEDIAN
    +0.0915; Wilcoxon p = 0.2754. The near-zero mean is driven almost entirely
    by seed45, where MI-Greedy failed badly (1.5396). On the median seed MF-DRO
    is slightly WORSE. Reporting means alone would mislead.
  freeze_resolved: >
    0/10 runs frozen vs a pre-fix 9/12 (75%). Improvements [5,1,2,4,5,1,3,3,5,1].
  power_caveat: >
    0.0045 mean difference against MI-Greedy sd 0.400 -- UNDERPOWERED to
    distinguish. Never state as demonstrated equivalence.

evaluation:
  benchmark: Hartmann_6D
  baselines: [MF-MI-Greedy, MF-GP-UCB]
  seeds: 10
  metric: final simple regret at matched real cost
  success_test: MF-DRO mean+SE < best-baseline mean-SE

critical_caveat: >
  A target-leakage bug in the Decision Transformer readout was found and fixed
  in commit 7bcc3b8, AFTER the 1280-run inventory and every prior finding was
  generated. All pre-fix DRO-family numbers (freeze rates, regret values) are
  suspect and must be re-measured before use.

hypotheses:
  H0:
    statement: Narrow-basin coverage failure at initialization
    status: REFUTED by inventory
    evidence: MF-MI-Greedy freezes 0/10 on the same benchmark and init family
    note: >
      Unaffected by the leak finding (MI-Greedy has no DT). Still requires a
      user amendment to PROTOCOL.md's "leading hypothesis" section.
  H1:
    statement: Freeze originates in the DRO/DT component, not multi-fidelity
    status: SUPPORTED, now with a concrete mechanism
    evidence: >
      Target leakage: readout was h[:, 3::4], the ACTION token, which under
      triu(diagonal=1) self-attention embeds the true action. All three heads
      predicted from their own target; propose_mf zeroes that slot at
      inference. Ablation: zeroing a_emb cost the fidelity head 15.6% of its
      loss pre-fix vs 0.7% post-fix. The SF path carried the identical bug
      ([:, 2::3]), so ONE mechanism covers SF-DRO (12/12) and MF-DRO -- the
      fidelity-threshold bug could not, since SF-DRO has no fidelity head.
    open: does fixing it change end-to-end regret? -> h1-leak-fix-validation
  H2:
    statement: Freeze is a DRO x narrow-basin interaction
    status: SUPPORTED (untested directly, and pre-fix)
    evidence: MF-DRO does not freeze on Ackley 10D (incumbent-improved 7/9/8)
    note: >
      Partly reframed: on Hartmann the policy was converging on the SECOND
      optimum x2 (f=3.2031, ||x2-x*||=1.103), not failing to converge.
  H3:
    statement: >
      MF-GP-UCB's 100% freeze is a separate, already-documented mechanism
      (cost-ratio degeneration to all-LF), not the DRO pathology
    status: CONFIRMED empirically, all 10 seeds
    evidence: >
      src/baselines/mf_baselines.py:206-213 documents it. Now measured under
      the frozen protocol at matched cost=200: MF-GP-UCB mean_n_HF = 0.0 and
      mean_n_improved = 0.00 across ALL 10 seeds -- it never queries HF even
      once, so the HF incumbent mathematically cannot move. Its "freeze" is
      therefore a definitional consequence of the acquisition, not a shared
      pathology with the DRO family. Resolves a standing open question.

  H4:
    statement: >
      MF-DRO's RTG-insensitivity is attention under-allocation to the scalar
      conditioning tokens -- a named, published DT failure mode
    status: REFUTED (1e53812) -- adaln 0% vs token 25% of sweeps moved the argmax
    evidence_from_literature: >
      RADT (arXiv:2402.03923) diagnoses exactly our measurement: DT
      under-allocates attention to return-to-go tokens, decoupling actual from
      target return, and argues the fix must be STRUCTURAL not parametric.
      DDT (arXiv:2601.15953) gives an implementable mechanism: drop RTG from
      the input, condition via AdaLN-Zero on the last RTG (D4RL hopper-medium
      99.4 vs 68.3). See literature/rtg-attention-underallocation.md
    why_ours_should_be_worse: >
      Our layout is 4 tokens [rtg, btg, state, action] -- TWO of four are
      scalar conditioning signals competing for attention, vs one of three in
      standard DT.
    prediction_locked: >
      Under AdaLN, an RTG sweep over {0.1,0.5,1,2,5,10}x changes the proposed
      argmax on >30% of sweeps, vs a measured 0% under token conditioning.
    note: orthogonal to the 7bcc3b8 leak fix; that was labels, this is conditioning strength
    result: >
      AdaLN REMOVED what RTG sensitivity existed rather than adding it.
      Two self-corrections logged: (a) the prediction's "0% under token"
      premise was measured under different conditions -- this probe measures
      token at 25%; (b) AdaLN-Zero inits to identity and had only 10 epochs on
      one batch, a real confound, so this refutes "AdaLN is a cheap win", not
      the RADT/DDT mechanism at full training scale.
  H5:
    statement: >
      The bottleneck is h -> score (the score head is nearly indifferent to its
      hidden state and ranks largely by mu_H), NOT rtg -> h
    status: PROPOSED by the H4 result, not yet tested
    evidence: >
      Both H4 arms show argmax(score)==argmax(mu_H) on 67-75% of pools.
      Independently, replacing h with the batch mean or a SHUFFLED h changes
      the argmax only ~8% of the time. So conditioning reaches h fine, but h
      barely reaches the score. This explains why every conditioning-side
      intervention has failed and predicts further ones will too.

  H6:
    statement: The DT's learned conditioning contributes ~nothing
    status: INCONCLUSIVE at n=10; extension to a pre-specified n=30 running
    evidence: >
      Paired estimate never converged and changed SIGN: n=1 -0.208, n=5 -0.103,
      n=7 -0.010, n=9 +0.062, n=10 +0.098. At n=10 the 95% CI [-0.097, +0.292]
      straddles zero (Wilcoxon p=0.322). Variance ratio 4.79x but Levene
      (robust) p=0.209, and regret is right-skewed so Levene is the test to
      believe. NOTHING established at n=10.

running:
  - id: h6-extension
    protocol: experiments/h6-frozen-dt/protocol-extension.md
    locked_commit: b00dacd
    design: seeds 52-71 for BOTH arms -> final n=30, fixed in advance
    guards: >
      n=30 is primary AND final; no further extension regardless of outcome;
      primary prediction is a NULL (CI still contains zero) so a null cannot be
      spun as a finding. Stated up front that n=30 cannot resolve the +0.098
      mean (that needs ~80 seeds).
    compute: 7 + 8 = 15 workers x 1 thread

completed:
  - inventory of 1280 runs -> data/results_inventory.csv
  - freeze-rate table by method (PRE-FIX -- reference only)
  - verification that REVISION_LOG Hartmann claim is wrong
  - target-leakage bug found, fixed, ablation-verified (7bcc3b8)
  - reward switched to regret-based; gate z=2.63, p=0.0085 (was p~0.32)
  - fidelity threshold vs Bernoulli sampling measured (3 seeds x 40 iters)

lessons:
  - Completion order in a cost-budgeted grid is biased toward HF-heavy runs.
  - >
    'Regret moves only on HF queries WITHIN a run' does NOT imply 'more HF
    ACROSS runs => better regret'. FROZEN had more HF at unchanged regret.
  - Prefer robust tests (Levene) over parametric (F, Bartlett) on skewed regret
    data; they disagreed here and it changed the conclusion.
  - Report intermediate n as DIRECTION, never as result -- H6's estimate changed
    sign four times before settling.

next:
  - analyze h6 at the pre-specified n=30; report as primary AND final
  - if inconclusive: report "inconclusive at n=30", do NOT extend again
  - unresolved: RTG still does not move the argmax under a 0.1x-10x sweep
