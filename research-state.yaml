    check gives paired mean -0.018, sd 0.169, FIX2 better 2/5, ratio 0.11 -- the arms are TIED. The bar
    passed because argsort totally orders four numbers whether or not adjacent ones are separable. Recorded
    MET as registered AND uninformative at that position. New standing rule: an ordering bar needs a separability
    check on the adjacent pairs carrying its meaning. CONSEQUENCE: q=0.10 was never established as better
    than q~0.21 -- tied on regret AND mechanism. Calibration''s case stays controllability across benchmarks,
