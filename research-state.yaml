lessons:
  - Completion order in a cost-budgeted grid is biased toward HF-heavy runs.
  - >
    'Regret moves only on HF queries WITHIN a run' does NOT imply 'more HF
    ACROSS runs => better regret'. FROZEN had more HF at unchanged regret.
  - Prefer robust tests (Levene) over parametric (F, Bartlett) on skewed regret
    data; they disagreed here and it changed the conclusion.
  - Report intermediate n as DIRECTION, never as result -- H6's estimate changed
    sign four times before settling.

late_findings: >
  H24/H25: the fixed rule is uncertainty-AVERSE -- w[sigma_H]<0 on 9/10
  independently trained seeds (w[mu_H]>0 on 10/10), mean -0.2544 sd 0.2578.
  Sign robust, magnitude not. This is the causal link to the performance
  result: penalising HF uncertainty concentrates queries where the model is
  already confident. H26: BTG inert in-band (0/12) and OOD (0/12); RTG inert
  in-band (0/12) and 1/12 across 1e-3..1e6, so absolute invariance is not
  literally true but no in-distribution value moves the decision.
  Two channels must not be conflated: the training-signal channel is LIVE
  (H17 moved regret 0.5047->0.4007) while the inference-conditioning channel
  is INERT.

teacher_arc: >
  H28-H33 rewrote the causal account three times and settled it. The MF-MES
  teacher selects at the 2.9th percentile of sigma_H (H28) at every operating
  point swept (H29, never above 5.5% over 12 cells). The student does NOT invert
  its teacher -- RETRACTED -- it imitates. w[sigma_H]<0 is a PARTIAL coefficient
  under corr(mu,sigma)=-0.4696, and the teacher's own partial coef is negative
  too (H30), so it is suppression rather than aversion. The distillation is
  FAITHFUL, not lossy: teacher's rank of the student's pick is median 2 of 200
  (H32) -- my earlier 'lossy' read came from argmax agreement, a bad metric under
  near-ties. The one genuine divergence is FIDELITY: p spans 0.5570-0.5577
  (sd 2.4e-4) while the teacher's ell varies, corr=+0.155 (H33).
  Synthesis: the transformer is redundant on location, uninformative on
  fidelity, adds no conditioning, and inherits an exploitative demonstrator.

h31_result: >
  COMPLETE (8900s). Teacher-only 0.4781 +/- 0.0414 vs MF-DRO 0.4007 +/- 0.0475;
  paired +0.0774, teacher better on 3/10, Wilcoxon p=0.2324. H32's locked
  expectation of near-parity CONFIRMED; 'transformer is a net negative' REFUTED.
  Most consequential: the TEACHER ALONE also fails the frozen test (0.5195 vs
  0.3825), so the ceiling is the acquisition, not the machinery around it.
  Fidelity: teacher 11.4% HF over 112 iters vs MF-DRO 26.7% over 70.7.

superseded_running_h31: >
  Teacher-only arm under the frozen evaluation (no DT deciding; DT still trained
  so the RNG stream matches and the teacher sees identical candidate pools).
  Tests the expectation recorded in H32 BEFORE it lands: near-parity, since the
  location distillation is faithful. A clear teacher win would implicate the
  fidelity channel measured in H33.

conclusion: >
  The research question is ANSWERED: no within-frame fix beats MF-MI-Greedy and
  MF-GP-UCB at matched real cost. Two rewards were run under the frozen
  evaluation and both FAIL the success test (0.5442 and 0.4481 vs 0.3825). The
  gap narrowed by roughly half; it did not close. Eleven pre-registered
  interventions on the conditioning pathway are all null or void, and the
  mechanism is measured: a ~10x attenuation of state variation (0.346x encoder,
  0.294x head) leaves the argmax invariant 0/12 both within and across
  iterations. H20 refuted the one architectural fix that could have made this a
  positive result. Empirical programme COMPLETE; proceeding to write-up.

