stall_thread_CLOSED: |
  Stall length does not predict regret. In HF-opportunity units MF-DRO and
  MI-Greedy tie at 34% terminal stall with opposite regret profiles, and
  MI-Greedy has the lowest terminal stall on Hartmann (2%) with the worst regret
  there -- a short terminal stall means "had not converged". Stalls are also
  routinely broken (MF-MES recovered from 111 queries). So stall detection cannot
  trigger an adaptive intervention, and adaptive pool widening is dropped
  unspent. Zero QUERY FREEZES on all 9 h57 MF-DRO finals.

rho_thread_CLOSED: |
  The sigmoid ceiling never binds: fitted rho is 0.8436 / 0.7797 / 0.8435 on
  Borehole / Hartmann / Currin against true slopes 1.2566 / 0.9792 / 1.0104. rho
  sits near its 0.8 init because fit() takes 3 Adam steps per call and the
  flexible delta-GP absorbs the shortfall, killing rho's gradient. h67 (softplus
  link) was built, its regression gate PASSED, and it was CANCELLED before launch
  -- 6 jobs avoided. Revises h63: RHOTRUE's Borehole gain was not ceiling removal,
  and its -16.6% on Hartmann (where the true slope IS representable) shows the
  under-fitted rho ~= 0.78 beats the true slope. rho is a regulariser, not a slope
  estimate, so every "fit rho more faithfully" follow-up inherits a refuted premise.

north_star_standing: |
  No DRO variant is best on any benchmark except Currin, where every method but
  MF-GP-UCB is at ~0%. Best per benchmark: SF-MES 0.0% (Currin), MF-MES 8.5%
  (Hartmann), MF-MI-Greedy 8.3% (Borehole). SF-DRO's best showing is Hartmann
  11.5%, still behind MF-MES. North star NOT met.
  Evaluation asymmetry documented (frozen, not changed): initial design is not
  charged against the 200 budget, and MF arms get a free LF init worth +15/+45/+20
  cost units. It runs AGAINST MF, so SF-DRO > MF-DRO on Hartmann/Borehole is
  conservative. Does NOT license "MF hurts DRO" (lesson 22 retraction stands).

variance_hypothesis_REFUTED: |
  "DRO buys consistency not mean" formed from 3 instances (h61 REFINE sd 1.41,
  h64 POOL600 sd 0.0604, SF-DRO Hartmann sd 1.76 vs 10.05). Tested on all 6
  DRO-vs-MES pairs: DRO lower sd in 4/6, but lower WORST-CASE regret in only 2/6.
  Borehole SF has lower sd around a worse mean AND worse worst case. Refuted.
  Lesson 19 shape caught BEFORE reporting for the first time.

