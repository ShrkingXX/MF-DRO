    '
  results: 'Borehole final_regret 35.882->44.900, +9.018, effect 5.69, 5/5 -- the largest effect measured
    in this project. Borehole waste 1.28 5/5. Hartmann regret 1.01 4/5. Hartmann waste no separation (0.10).
