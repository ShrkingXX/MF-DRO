h116_CORRECTION_same_day:
  withdrawn: '"MF-DRO misallocates dispersion across dimensions." Seven of eight Borehole dims give sd
    ratio 0.97 weighted AND unweighted. The whole effect is dim 0.

    '
  actual_finding: 'Borehole dim 0 (r_w, S1 0.858) has a BOUNDARY optimum. MF-MES pins to it: 100% of HF
    queries at z0>=0.9, sd 0.001-0.013. MF-DRO drifts: 84-97%, sd 0.032-0.104. MF-DRO spends 8.9% of HF
    queries (3.2-16.5%) off the boundary, MF-MES 0.0%, and those queries are strictly wasted -- best off-boundary
    y is below mean on-boundary y in 5/5 seeds.

    '
  status: EXPLORATORY on h83 seeds 42-46. h117 predictions 4-6 test it on 52-56.
  next_intervention_candidate: 'Not ARD-weighted L_loc. The output parameterisation: action_head(h).clamp(0,1)
    cannot represent a boundary optimum without saturating, which is the already-registered and never-run
    boundary-aversion causal test.

    '
h116_QUALIFICATION_baseline_confound:
  fact: 'mf_mes_takeno.py:297 optimize_acquisition = 2048-pt Sobol pool -> top-10 -> box-constrained L-BFGS-B.
    MF-DRO''s query is action_head(h).clamp(0,1) regressed on 600 i.i.d.-uniform teacher candidates (_draw_raw
    = torch.rand), with NO continuous refinement anywhere.

    '
  consequence: 'A box-constrained quasi-Newton method converges onto active constraints, so MF-MES''s
    0.0% off-boundary rate is largely its optimiser, not better search. The 8.9% wasted-budget deficit
    SURVIVES as an end-to-end method comparison. "The DT is boundary-averse" does NOT survive -- the arms
    differ by construction in exactly the way that produces the contrast.

    '
  new_open_question: 'How much of MF-DRO''s deficit is the ABSENCE OF CONTINUOUS REFINEMENT rather than
    the DT, the ROI, or the loss? No experiment separates them. NOTE: a refinement-based fix imports the
    baseline''s machinery and falls under the same objection as use_candidate_scoring=True -- it would
    replace the contribution, not repair it. Argue that BEFORE running it.

    '
  method_lesson: 'I published the 8.9%-vs-0.0% comparison before reading how the baseline picks its query.
    The number was right, the implied mechanism was not. Checking how the OTHER arm works is part of interpreting
    a gap.

    '
h118_roi_boundary_waste:
  status: COMPLETE. Locked prediction NOT supported (effect 0.62, needed 1.0).
  compute: zero new runs (re-analysis of h90, Borehole seeds 47-51).
  gate_miss: 'ROI-Q10 vs NO-ROI: 4/5 seeds but effect 0.62 (0.76 at the 0.95 cut).'
  exploratory: 'REFINE-100 (use_roi=False, teacher_refine_samples=100) puts 54.2% of HF queries on the
    boundary vs NO-ROI 14.7% (non-overlapping per-seed ranges) and cuts waste 6.79 pts, effect 1.90, 5/5.
    It clamps local Gaussians to the box (mf_dro.py:1543); torch.rand never reaches the corner in 8D.
    A FILTER CANNOT CREATE MASS THE PROPOSAL DISTRIBUTION NEVER HAD -- which also explains MF-MES''s boundary
    behaviour (box-constrained L-BFGS-B).

    '
  KEY_NEGATIVE: 'ROI-Q10 and REFINE-100 reach the same final value (271.64 vs 271.03) while differing
    2.8x in wasted budget; r(waste, final y) = -0.255 over 15 runs. The boundary waste is real, reproducibly
    fixable, and does NOT buy performance. h116 must not be read as the reason MF-DRO loses.

    '
  consequence_for_primary_question: 'Two mechanistic candidates for the ROI''s Borehole benefit are now
    ruled out by pre-registered tests: dispersion (h116) and boundary resolution (h118). The channel remains
    UNIDENTIFIED.

    '
