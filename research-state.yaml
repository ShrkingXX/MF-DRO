    insufficient spread, was not in my two-way framing. Second time today a
    two-way framing excluded the truth.
    CHANGES THE PRESCRIPTION from h96's implied architecture rewrite: the head
    already gets 83-98% of the way. Two cheap levers -- sharpen centring via a
    sensitivity-weighted L_loc (preferred, one loss change), or widen the output
