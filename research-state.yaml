  amendments:
  - '1: stored x has no common coordinate scale (Borehole raw, box widths to 5.25e4; Hartmann unit cube).
    First run measured the domain box, not the policy. Filed after seeing the numbers; says so. Originals
    kept as SUPERSEDED.'
  - '2: n>=15 non-init HF query floor. Removes 4/5 Hartmann seeds.'
  exploratory_result_needing_replication:
    borehole_weighted_over_unweighted_dispersion_ratio:
    - 2.95
    - 3.22
    - 2.96
    - 3.67
    - 5.53
    effect_abs_mean_log_over_sd: 4.84
    reading: 'MF-DRO and MF-MES spread HF queries by the same TOTAL amount on Borehole (1.06x) but MF-DRO''s
      is 3.96x larger weighted by variance share. The excess sits in the dimensions that matter. "Blind
      to relevance" is the WRONG description -- the allocation is the systematic inverse of MF-MES''s,
      not random. Accurate wording: fails to localise along the dimensions that determine the objective.

      '
